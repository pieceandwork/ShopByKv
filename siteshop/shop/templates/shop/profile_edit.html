{% extends 'base.html' %}

{% block content %}
<h1>Редактирование профиля</h1>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="form-error">{{ form.non_field_errors }}</div>

    <p><strong>Логин:</strong> {{ user.username }} <em>(нельзя изменить)</em></p>
    <p><strong>Email:</strong> {{ user.email }} <em>(нельзя изменить)</em></p>

    {% for f in form %}
        <p><label class="form-label">{{ f.label }}</label>{{ f }}</p>
        <div class="form-error">{{ f.errors }}</div>
    {% endfor %}

    <p>
        <button type="submit">Сохранить</button>
        <a href="{% url 'profile' %}" class="btn-cancel">Отмена</a>
    </p>
</form>
{% endblock %}
