{% extends 'base.html' %}

{% block content %}
<h1>Новый пароль</h1>

{% if validlink %}
    <form method="post">
        {% csrf_token %}
        <div class="form-error">{{ form.non_field_errors }}</div>
        {% for f in form %}
            <p><label class="form-label">{{ f.label }}</label>{{ f }}</p>
            <div class="form-error">{{ f.errors }}</div>
        {% endfor %}
        <p><button type="submit">Сохранить пароль</button></p>
    </form>
{% else %}
    <p>Ссылка недействительна или устарела. <a href="{% url 'password_reset' %}">Запросите новую</a>.</p>
{% endif %}
{% endblock %}
