{% extends 'base.html' %}

{% block content %}
<h1>Удалить товар?</h1>
<p>Вы уверены, что хотите удалить «{{ object.title }}»? Это действие необратимо.</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Да, удалить</button>
    <a href="{% url 'post' object.slug %}" class="btn-cancel">Отмена</a>
</form>
{% endblock %}
