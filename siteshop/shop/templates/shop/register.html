{% extends 'base.html' %}

{% block content %}
<h1>Регистрация</h1>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="form-error">{{ form.non_field_errors }}</div>
    {% for f in form %}
        <p><label class="form-label">{{ f.label }}</label>{{ f }}</p>
        <div class="form-error">{{ f.errors }}</div>
    {% endfor %}
    <p><button type="submit">Зарегистрироваться</button></p>
</form>

<p>Уже есть аккаунт? <a href="{% url 'login' %}" class="btn-link">Войти</a></p>
{% endblock %}
