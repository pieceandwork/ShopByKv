{% extends 'base.html' %}

{% block content %}
<h1>Сброс пароля</h1>
<p>Введите email, привязанный к аккаунту — мы отправим ссылку для сброса.</p>

<form method="post">
    {% csrf_token %}
    <div class="form-error">{{ form.non_field_errors }}</div>
    {% for f in form %}
        <p><label class="form-label">{{ f.label }}</label>{{ f }}</p>
        <div class="form-error">{{ f.errors }}</div>
    {% endfor %}
    <p><button type="submit">Отправить</button></p>
</form>
{% endblock %}
